<app-navbar />

<div>
  <button (click)="tab = 'login'" [disabled]="tab === 'login'">Login</button>
  <button (click)="tab = 'register'" [disabled]="tab === 'register'">Register</button>
</div>

@if (tab === 'login') {
  <form (ngSubmit)="onLogin()">
    <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required />
    <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required />
    <button type="submit">Login</button>
  </form>
}

@if (tab === 'register') {
  <form (ngSubmit)="onRegister()">
    <input type="text" placeholder="Name" [(ngModel)]="name" name="name" required />
    <input type="email" placeholder="Email" [(ngModel)]="email" name="email" required />
    <input type="password" placeholder="Password" [(ngModel)]="password" name="password" required />
    <button type="submit">Register</button>
  </form>
}

@if (error) {
  <p>{{ error }}</p>
}
